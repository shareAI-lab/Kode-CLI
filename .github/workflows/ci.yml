name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.6

      - name: Install locked dependencies
        id: install
        run: bun install --frozen-lockfile

      - name: Install Linux sandbox test dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap socat

      - name: Format
        if: ${{ !cancelled() && steps.install.outcome == 'success' && runner.os == 'Linux' }}
        run: bun run format:check

      - name: Architecture boundaries
        if: ${{ !cancelled() && steps.install.outcome == 'success' && runner.os == 'Linux' }}
        run: bun run architecture:check

      - name: Focused runtime and CLI regressions
        if: ${{ !cancelled() && steps.install.outcome == 'success' && runner.os != 'Linux' }}
        run: >-
          bun test
          ./packages/runtime/src/test/unit/sandboxEnv.test.ts
          ./packages/runtime/src/test/unit/sandboxBoundaries.test.ts
          ./packages/runtime/src/test/unit/shellCommandArgs.test.ts
          ./packages/runtime/src/test/unit/socatPaths.test.ts
          ./apps/cli/src/utils/externalEditor.test.ts
          ./packages/core/src/test/unit/git-hooks.test.ts
          ./packages/core/src/test/unit/cli-config-models-help.test.ts
          ./packages/core/src/test/unit/cli-context-help.test.ts
          ./packages/core/src/test/unit/cli-mcp-help.test.ts
          ./packages/config/src/test/unit/settings-files.test.ts
          ./packages/core/src/test/unit/permission-settings-fail-closed.test.ts
          ./packages/core/src/test/integration/cli-settings-fail-closed.test.ts
          ./apps/server/src/settings-policy.test.ts

      - name: Typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' && runner.os == 'Linux' }}
        run: bun run typecheck

      - name: Isolated full test suite
        if: ${{ !cancelled() && steps.install.outcome == 'success' && runner.os == 'Linux' }}
        env:
          KODE_REQUIRE_SANDBOX_TESTS: '1'
        run: bun test

      - name: Build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run build

      - name: Dependency security regressions
        if: ${{ !cancelled() && steps.install.outcome == 'success' && runner.os == 'Linux' }}
        env:
          CI_AUDIT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$CI_AUDIT_BASE_SHA"
          bun scripts/audit-regressions.mjs
